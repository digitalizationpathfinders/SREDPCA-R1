<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose Task</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
            font-family: Arial, sans-serif;
        }
        button {
            padding: 15px 30px;
            margin: 10px;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h2>Select a Task</h2>
    <button onclick="chooseTask(1)">Task 1</button>
    <button onclick="chooseTask(2)">Task 2</button>
    <button onclick="chooseTask(3)">Task 3</button>


    <script>
        // A new task selection starts with a clean session and task-scoped PCA lists.
        document.addEventListener('DOMContentLoaded', () => {
            sessionStorage.clear();
            Object.keys(localStorage).forEach(key => {
                if (key && key.indexOf('pca_list_task_') === 0) localStorage.removeItem(key);
            });
        });
        function chooseTask(taskNumber) {
            const tasks = {

                1: {
                    accountInfo: {
                        businessNumber: "123456789 RC 001",
                        businessName: "Nick's Hat Shop",
                        telNumber: "613-123-4567",
                    },
                    bn9: "123456789",
                    account: "RC001"
                },
                2: {
                    accountInfo: {
                        businessNumber: "987654321 RC 002",
                        businessName: "Maple Supplies Ltd.",
                        telNumber: "613-555-1212"
                    },
                    bn9: "987654321",
                    account: "RC002"
                },
                3: {
                    accountInfo: {
                        businessNumber: "555555555 RC 003",
                        businessName: "Acme Robotics",
                        telNumber: "613-777-8888"
                    },
                    bn9: "555555555",
                    account: "RC003",
                    // Pre-populate one PCA with two projects for demo
                    pcaList: [
                        {
                            id: "pca_task3_1",
                            name: "Acme Q4 R&D",
                            status: "In progress",
                            lastModified: "2026-09-14T12:00:00.000Z",
                            projects: [
                                {
                                    id: "proj_task3_1",
                                    name: "Autonomous navigation",
                                    status: "In progress",
                                    created: "2026-08-01T09:00:00.000Z",
                                    lastModified: "2026-08-15T10:00:00.000Z",
                                    data: { projecttitle: "Autonomous navigation" }
                                },
                                {
                                    id: "proj_task3_2",
                                    name: "Sensor fusion",
                                    status: "Complete",
                                    created: "2026-07-01T09:00:00.000Z",
                                    lastModified: "2026-08-20T10:00:00.000Z",
                                    data: { projecttitle: "Sensor fusion" }
                                }
                            ]
                        }
                    ]
                }
            };

            const task = tasks[taskNumber];
            const taskJson = JSON.stringify(task);
            const pcaKey = `pca_list_task_${taskNumber}`;
            const pcaList = task.pcaList || [];

            // Session is the primary handoff; localStorage keeps file:// navigation reliable.
            sessionStorage.setItem('selectedTask', taskJson);
            sessionStorage.setItem('taskNum', String(taskNumber));
            sessionStorage.setItem('pcaList', JSON.stringify(pcaList));
            localStorage.setItem('selectedTask', taskJson);
            localStorage.setItem('taskNum', String(taskNumber));
            localStorage.setItem(pcaKey, JSON.stringify(pcaList));

            window.location.href = "pca-overview.html";
        }
    </script>
</body>
</html>
