<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PCA Projects</title>
<link rel="stylesheet" href="styles/base.css">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
<header class="header">
	<div class="top-ctn">
		<div class="top-content">
			<div class="brand"> <img src="https://www.canada.ca/etc/designs/canada/wet-boew/assets/sig-blk-en.svg" alt="Government of Canada"> </div> <a href="#" class="language-switch">Français</a> </div>
	</div>
	<div class="bottom-ctn">
		<div class="bottom-content">
			<div class="left-content">
			Canada Revenue Agency<br>
			My Business Account
			</div>
			<div class="right-content">
				<div>
					<span class="material-icons biz-icon">business_center</span>
				</div>
				<div class="account-info">
				<span id="task-account-name"></span>
				<span id="task-account-bn9"></span>
				</div>
				
			</div>
		</div>
	</div>
</header>
<div class="page-container">
	<div class="heading">
		<div class="small-h1">Scientific Research & Experimental Development (SR&ED)</div>
		<h1 id="pca-title">Pre-claim approval (PCA) project list</h1>
		<h4 id="PCA-name"><span class="pca-name-text"></span><button id="edit-pca-name-btn" class="btn-tertiary"><span class="material-icons">edit</span>Edit PCA name</button></h4>
	</div>
	<main id="pca-projects" class="content">
		<section>
			<table id="pca-projects-tb" class="table" cellpadding="0" cellspacing="0">
				<thead>
					<tr>
						<th>Project name</th>
						<th>Status</th>
						<th>Action</th>
					</tr>
				</thead>
				<tbody>
				</tbody>
			</table>
			<div style="text-align:left;margin-top:8px;">Total projects: <span id="pca-project-count">0</span> of 3</div>
			<div class="btn-container">
				<button id="add-new-project" class="btn btn-primary" type="button">Add a new project</button>
			</div>
		</section>
	</main>
</div>

<!-- Edit PCA name lightbox (shared) -->
<div id="edit-pca-lightbox" class="lightbox-container">
	<div class="lightbox">
		<div class="header">
			<h3>Edit PCA name</h3>
			<button class="btn-tertiary" type="button" data-closebtn="edit-pca-lightbox">
			<span class="material-icons">clear</span></button>
		</div>
		<div class="lightbox-content">
			<form id="edit-pca-form">
				<label for="edit-pca-name" class="required-label">PCA name</label>
				<input type="text" id="edit-pca-name" name="edit-pca-name" maxlength="200">
				<div class="btn-container">
					<button type="button" class="btn btn-secondary" data-closebtn="edit-pca-lightbox">Cancel</button>
					<button type="submit" class="btn btn-primary">Save</button>
				</div>
			</form>
		</div>
	</div>
</div>

<!-- Quick debug: report session/local storage and that the page JS is about to load -->
<script src="scripts.js"></script>
</body>
</html>
